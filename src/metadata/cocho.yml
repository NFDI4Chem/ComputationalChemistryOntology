# PURL configuration for http://purl.obolibrary.org/obo/cocho

idspace: COCHO
base_url: /obo/cocho

products:
- cocho.owl: https://raw.githubusercontent.com/NFDI4Chem/ComputationalChemistryOntology/main/cocho.owl
- cocho.obo: https://raw.githubusercontent.com/NFDI4Chem/ComputationalChemistryOntology/main/cocho.obo

term_browser: ontobee
example_terms:
- COCHO_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com/NFDI4Chem/ComputationalChemistryOntology/v

- prefix: /tracker/
  replacement: https://github.com/NFDI4Chem/ComputationalChemistryOntology/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/COCHO?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com/NFDI4Chem/ComputationalChemistryOntology/main/
